<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Memory Match</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#1b1340">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#1b1340;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 14px 20px}
h1{font-size:22px;margin:4px 0 10px}.bar{display:flex;gap:8px;width:100%;max-width:420px;justify-content:space-between;align-items:center;margin-bottom:12px}.pill{background:#2a1f63;border-radius:14px;padding:8px 12px;font-size:14px;white-space:nowrap}
button{font:inherit;color:#fff;background:#8e7dff;border:0;border-radius:14px;padding:10px 14px;font-weight:700}button.g{background:#2a1f63}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:420px;direction:ltr}
.c{aspect-ratio:1;perspective:600px;background:none;padding:0;border:0}.in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}.c.f .in,.c.m .in{transform:rotateY(180deg)}
.fa,.ba{position:absolute;inset:0;border-radius:16px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;font-size:clamp(28px,10vw,46px)}.ba{background:linear-gradient(135deg,#8e7dff,#ff6b9d)}.fa{background:#fff;transform:rotateY(180deg)}.c.m .fa{background:#b9f6ca}
.msg{margin:14px 0;font-size:18px;min-height:26px;text-align:center}.sp{flex:1}.note{font-size:12px;color:#b9b2e6;margin-top:8px;text-align:center}
</style></head><body>
<h1 id="t"></h1>
<div class="bar"><span class="pill" id="mv"></span><span class="pill" id="tm"></span><span class="pill" id="bs"></span></div>
<div class="grid" id="g"></div>
<div class="msg" id="ms"></div>
<div class="bar"><button id="nw"></button><button class="g" id="lg"></button><button class="g" id="ins" hidden></button><a href="blocks.html" id="bl" style="color:#fff;background:#2a1f63;border-radius:14px;padding:10px 14px;font-weight:700;text-decoration:none"></a></div>
<div class="note" id="nt"></div>
<script>
const S={ar:{t:'لعبة الذاكرة',mv:'الحركات',tm:'الوقت',bs:'أفضل',nw:'لعبة جديدة',win:'برافو! خلصتها في {m} حركة و{s} ثانية',rec:'رقم قياسي جديد!',ins:'تثبيت التطبيق',nt:'لعبة مجانية تشتغل بدون إنترنت. مفيش حسابات ولا جمع بيانات، النتائج بتتحفظ على جهازك بس.'},en:{t:'Memory Match',mv:'Moves',tm:'Time',bs:'Best',nw:'New game',win:'Well done! {m} moves, {s} seconds',rec:'New record!',ins:'Install app',nt:'Free game that works offline. No accounts, no data collection. Scores stay on your device.'}};
let L=localStorage.getItem('pg_lang')||((navigator.language||'ar').startsWith('ar')?'ar':'en');
const E=['🦊','🐼','🦁','🐸','🐙','🦄','🐝','🐳'];let cards=[],open=[],lock=false,moves=0,t0=0,tick=null,done=0;
const $=i=>document.getElementById(i),T=k=>S[L][k];
function bestKey(){return 'pg_best'}
function ui(){document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';$('t').textContent=T('t');$('nw').textContent=T('nw');$('lg').textContent=L==='ar'?'EN':'AR';$('ins').textContent=T('ins');$('bl').textContent=L==='ar'?'تركيب الأشكال':'Shape Fit';$('nt').textContent=T('nt');stat()}
function stat(){$('mv').textContent=T('mv')+': '+moves;const s=t0?Math.floor((Date.now()-t0)/1000):0;$('tm').textContent=T('tm')+': '+s+'s';const b=localStorage.getItem(bestKey());$('bs').textContent=T('bs')+': '+(b?b:'-')}
function newGame(){clearInterval(tick);t0=0;moves=0;open=[];lock=false;done=0;$('ms').textContent='';const a=E.concat(E);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
const g=$('g');g.innerHTML='';cards=a.map((e,i)=>{const b=document.createElement('button');b.className='c';b.setAttribute('aria-label','card '+(i+1));b.innerHTML='<div class="in"><div class="ba"></div><div class="fa">'+e+'</div></div>';b.onclick=()=>flip(i);g.append(b);return {e,b,m:false}});stat()}
function flip(i){const c=cards[i];if(lock||c.m||open.includes(i))return;if(!t0){t0=Date.now();tick=setInterval(stat,1000)}c.b.classList.add('f');open.push(i);if(open.length===2){moves++;const[x,y]=open;if(cards[x].e===cards[y].e){[x,y].forEach(k=>{cards[k].m=true;cards[k].b.classList.add('m')});open=[];done++;if(navigator.vibrate)navigator.vibrate(30);if(done===E.length)win()}else{lock=true;setTimeout(()=>{[x,y].forEach(k=>cards[k].b.classList.remove('f'));open=[];lock=false},700)}}stat()}
function win(){clearInterval(tick);const s=Math.floor((Date.now()-t0)/1000);let m=T('win').replace('{m}',moves).replace('{s}',s);const b=+localStorage.getItem(bestKey())||0;if(!b||moves<b){localStorage.setItem(bestKey(),moves);m+=' | '+T('rec')}$('ms').textContent=m;stat()}
$('nw').onclick=newGame;$('lg').onclick=()=>{L=L==='ar'?'en':'ar';localStorage.setItem('pg_lang',L);ui()};
let dp=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;if(!matchMedia('(display-mode: standalone)').matches)$('ins').hidden=false});$('ins').onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;$('ins').hidden=true}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
ui();newGame();
</script></body></html>
