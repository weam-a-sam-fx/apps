<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Funded Guild</title>
<style>

.wc { --gold: #d4af37; --gold2: #f1d36b; --bg: #0b0b0d; --card: #15151a; --line: #2a2a31; --tx: #f2eee3; --mut: #9a968a;
  min-height: 100vh; box-sizing: border-box; max-width: 520px; margin: 0 auto; padding: 16px 16px 14px; color: var(--tx);
  font-family: 'Cairo', 'Segoe UI', Tahoma, system-ui, sans-serif; font-size: 15px; line-height: 1.35;
  background: radial-gradient(120% 60% at 50% 0%, #1d180a 0%, var(--bg) 60%); }
.wc * { box-sizing: border-box; }
.wc-h { text-align: center; margin-bottom: 12px; }
.wc-brand { display: inline-block; font-family: Georgia, 'Times New Roman', serif; letter-spacing: .28em; font-weight: 700; font-size: 20px;
  background: linear-gradient(180deg, var(--gold2), var(--gold) 60%, #9c7a1c); -webkit-background-clip: text; background-clip: text; color: transparent; }
.wc-h h1 { margin: 2px 0 0; font-size: 15px; font-weight: 600; color: var(--mut); }
.wc-in { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.wc-full { grid-column: 1 / -1; }
.wc-f { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.wc-f > span { font-size: 12px; color: var(--mut); }
.wc input, .wc select { width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--tx);
  padding: 0 12px; font: inherit; font-size: 16px; outline: none; }
.wc input[dir="ltr"] { text-align: left; }
.wc input:focus, .wc select:focus { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(212,175,55,.2); }
.wc-risk { display: flex; gap: 8px; }
.wc-seg { display: flex; flex: none; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
.wc-seg button { width: 52px; border: 0; background: transparent; color: var(--mut); font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; }
.wc-seg button.on { background: linear-gradient(180deg, var(--gold2), var(--gold)); color: #1a1405; }
.wc-out { margin-top: 12px; padding: 12px; border: 1px solid #4a3d14; border-radius: 14px; background: linear-gradient(180deg, #17140b, var(--card)); }
.wc-lot { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.wc-lot small { display: block; font-size: 12px; color: var(--mut); }
.wc-lot b { font-size: 34px; line-height: 1.1; color: var(--gold2); font-variant-numeric: tabular-nums; }
.wc-lot-raw b { font-size: 18px; color: var(--tx); }
.wc-grid { margin: 10px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
.wc-grid div { min-width: 0; }
.wc-grid dt { font-size: 12px; color: var(--mut); }
.wc-grid dd { margin: 0; font-weight: 700; font-size: 16px; text-align: right; font-variant-numeric: tabular-nums; }
.wc-err { margin: 6px 0 0; color: #ff8a80; font-size: 13px; }
.wc-ft { margin-top: 10px; text-align: center; font-size: 11.5px; color: var(--mut); }
.wc-ft b { color: var(--gold); }
@media (min-width: 768px) {
  .wc { max-width: 560px; padding-top: 48px; font-size: 16px; }
  .wc-lot b { font-size: 44px; }
}
.wc-mode { width: 100%; margin-bottom: 10px; }
.wc-mode button { flex: 1; width: auto; height: 40px; font-size: 14px; }
.wc-presets { width: 100%; }
.wc-presets button { flex: 1; width: auto; height: 40px; font-size: 14px; }
.wc-note { margin: 8px 0 0; font-size: 11.5px; color: var(--mut); }
.wc-note p { margin: 2px 0; }
.wc-note a { color: var(--gold); }
.wc-note bdi { white-space: nowrap; }

 جيلد",heroTitle:"الفيصل بينك وبين شركات التمويل",statWatched:"شركة تحت المراقبة",statRanked:"في الترتيب",statWatch:"في قائمة الانتباه",statChecked:"آخر تحقق",trust1:"مصادر معلنة بتاريخها",trust2:"منهج تقييم مكتوب بالكامل",h2Rank:"ترتيب شركات التمويل",h2RankSub:"تقييم فاندد جيلد من 100، محسوب بالمنهج المكتوب تحت",of100:"من 100",onTp:"على Trustpilot",reviews:"مراجعة",lblDd:"أقصى تراجع",lblSplit:"نسبة الأرباح",upTo:"حتى",lblFee:"أقل باقة",from:"من",lblPayout:"السحب",lblFounded:"التأسيس",lblHq:"المقر",rulesH:"القواعد والشروط",offersH:"أحدث العروض والأكواد",codeLbl:"الكود",whyH:"ليه تشتغل على حساب ممول؟",whyHSub:"وجهة نظر متداول، بالمميزات والمقابل",w1t:"رأس مال أكبر من جيبك",w1p:"بدل ما تتداول بألف دولار من فلوسك، بتتداول بحساب 50 أو 100 ألف مقابل رسوم تحدي صغيرة. الربح على الحساب الكبير، والمخاطرة من جيبك محدودة.",w2t:"خسارتك معروفة من الأول",w2p:"أقصى حاجة ممكن تخسرها هي رسوم التحدي. مش مدخراتك ولا فلوس بيتك، وده فرق نفسي كبير في التداول.",w3t:"سحوبات من الأرباح",w3p:"لما بتكسب، نسبتك بتتحول لحسابك حسب شروط الشركة وجدول سحوباتها، وبعض الشركات بتوصل لسحب في نفس اليوم. وفي شركات بترجعلك رسوم التحدي مع أول سحب.",w4t:"حسابك بيكبر معاك",w4p:"أغلب الشركات عندها خطط تدرج: كل ما تثبت أداء، رأس مال الحساب يزيد، لحد ما يوصل ملايين عند بعض الشركات.",w5t:"الهامش والمرونة",w5p:"الرافعة اللي الشركة بتديها على الحساب الممول بتديك مساحة حركة أكبر من حساب شخصي بنفس المبلغ، وتقدر توزع صفقاتك براحتك جوه حدود الشركة.",w6t:"خطة إدارة رأس مال جاهزة",w6p:"حد الخسارة اليومي وأقصى تراجع مش قيود وبس، دي خطة انضباط جاهزة. اللي بيتعلم يشتغل جواها بيحافظ على حسابه، سواء ممول أو شخصي.",w7t:"برامج على مقاسك",w7p:"تقييم من مرحلة أو اتنين أو حساب فوري، وأحجام من 5 آلاف لحد 400 ألف. بتختار اللي يناسب أسلوبك وميزانيتك بدل ما تتقولب على نظام واحد.",w8t:"شغلك من أي مكان",w8p:"لا مكتب ولا مواعيد ولا رئيس. بتتداول من موبايلك أو جهازك في الوقت اللي يناسبك، والنتيجة هي اللي بتتكلم.",w9t:"وفي المقابل، بصراحة",w9p:"رسوم التحدي في معظم الشركات غير مستردة لو رسبت، والقواعد صارمة: لو كسرت الحد اليومي أو أقصى تراجع الحساب بيقفل فورًا، والسحوبات على شروط الشركة وتوقيتها. مفيش وعد بربح، في فرصة بقواعد واضحة.",watchH:"قائمة الانتباه",watchHSub:"شركات تقييمها محجوب على Trustpilot",watchP:"Trustpilot بيحجب تقييم الشركة لما يلاقي مراجعات مخالفة لإرشاداته. ده مش معناه إن الشركة نصّابة، لكن معناه إن رأي الجمهور الموثق عنها مش متاح حاليًا، فبنحطها هنا بدل الترتيب لحد ما يتضح.",watchFlag:"تقييم محجوب",methH:"إزاي بنقيّم؟",methHSub:"نفس المعادلة على كل شركة، من غير استثناءات",m1t:"السمعة",m1p:"تقييم Trustpilot بثلثين الدرجة، وعمر الشركة بثلثها (6 سنين أو أكثر = الدرجة الكاملة). لو التقييم محجوب لمخالفة، الشركة خارج الترتيب أصلًا.",m2t:"السحوبات",m2p:"تكرار السحب: نفس اليوم 100، أسبوعي 65، كل أسبوعين 45، شهري 25 — بوزن 75%، وتنوع وسائل السحب 25%.",m3t:"القواعد",m3p:"أقصى تراجع مسموح (10% أو أكثر = الدرجة الكاملة) بوزن 40%، وباقي القواعد (أيام التداول، المدة، الأخبار، الإكسبرتات) 60%.",m4t:"التكلفة",m4p:"نسبة الأرباح للمتداول بوزن 60%، ورسوم الدخول 40% (خمسين دولار أو أقل = الدرجة الكاملة).",methP:"النقطة اللي مش متوثقة عندنا بتحسب 50 محايدة، فلا شركة بتتكافأ ولا بتتعاقب على معلومة مش متاحة. والشركات اللي قفلت بتخرج من الترتيب.",contactH:"تواصل معنا",contactHSub:"سؤال أو تصحيح رقم؟ كلمنا على أي قناة",ch_messenger:"ماسنجر",ch_telegram:"تيليجرام",ch_whatsapp:"واتساب",ch_email:"البريد الإلكتروني",ch_facebook:"فيسبوك",comingSoon:"هيتضاف قريب",honestH:"مهم تعرفه",honest1:"حجب Trustpilot لتقييم أي شركة حقيقة معلنة على صفحتها، مش حكم منا.",honest2:"القواعد والأسعار بتتغير، فراجع موقع الشركة الرسمي قبل ما تدفع أي رسوم.",footer:"الفيصل بين المتداول وشركة التمويل · رأي وتجربة، مش توصية · الأرقام اتأكدت من مصادرها المكتوبة يوم {date}",lblPlat:"المنصات وسهولة الاستخدام",of5:"من 5",methPlat:"تقييم المنصات من 5 = عدد المنصات الكبرى اللي الشركة بتدعمها فعلًا، حسب صفحاتها الرسمية.",navHome:"الرئيسية",navTools:"الأدوات",navGuides:"أدلة سريعة",navNews:"أخبار الشركات",navWatch:"قائمة الانتباه",navAbout:"عن الموقع",navContact:"تواصل",toolsH:"أدوات تساعدك تختار",aboutH:"عن Funded Guild",aboutP1:"أنا وئام (W ded:"Founded",lblHq:"HQ",rulesH:"Rules and terms",offersH:"Latest offers and codes",codeLbl:"Code",whyH:"Why trade a funded account?",whyHSub:"A trader's point of view, the upsides and the trade-offs",w1t:"Capital bigger than your pocket",w1p:"Instead of trading $1,000 of your own money, you trade a $50K or $100K account for a small challenge fee. The profit is on the big account; the risk from your pocket stays limited.",w2t:"Your loss is known upfront",w2p:"The most you can lose is the challenge fee. Not your savings, not your household money, and that is a big psychological difference in trading.",w3t:"Payouts from profits",w3p:"When you win, your share reaches your account per the firm's terms and payout schedule, and some firms pay out the same day. Some firms even refund the challenge fee with your first payout.",w4t:"Your account grows with you",w4p:"Most firms have scaling plans: the more you prove performance, the more the account capital grows, up to millions at some firms.",w5t:"Margin and flexibility",w5p:"The leverage the firm gives on the funded account gives you more room than a personal account of the same size, and you can spread your trades freely within the firm's limits.",w6t:"A ready-made capital plan",w6p:"The daily loss limit and max drawdown are not just restrictions; they are a ready-made discipline plan. Whoever learns to work inside them protects their account, funded or personal.",w7t:"Programs that fit you",w7p:"One-step or two-step evaluations or instant accounts, in sizes from $5K to $400K. You pick what suits your style and budget instead of fitting into one system.",w8t:"Work from anywhere",w8p:"No office, no fixed hours, no boss. You trade from your phone or laptop whenever suits you, and the result does the talking.",w9t:"And honestly, in return",w9p:"The challenge fee at most firms is non-refundable if you fail, and the rules are strict: break the daily limit or max drawdown and the account closes instantly, and payouts follow the firm's terms and timing. There is no promise of profit; there is an opportunity with clear rules.",watchH:"Watchlist",watchHSub:"Firms whose Trustpilot rating is hidden",watchP:"Trustpilot hides a firm's rating when it finds reviews that violate its guidelines. That does not mean the firm is a scam, but it means the documented public opinion about it is currently unavailable, so we place it here instead of the ranking until things clear up.",watchFlag:"Rating hidden",methH:"How do we score?",methHSub:"The same formula for every firm, no exceptions",m1t:"Reputation",m1p:"Trustpilot rating weighs two thirds of the score, company age one third (6+ years = full marks). If the rating is hidden for a violation, the firm is out of the ranking entirely.",m2t:"Payouts",m2p:"Payout frequency: same day 100, weekly 65, biweekly 45, monthly 25, weighted 75%, plus variety of payout methods 25%.",m3t:"Rules",m3p:"Max allowed drawdown (10% or more = full marks) weighted 40%, and the remaining rules (trading days, duration, news, EAs) 60%.",m4t:"Cost",m4p:"Trader's profit split weighted 60%, entry fee 40% (fifty dollars or less = full marks).",methP:"Any point we cannot verify counts as a neutral 50, so no firm is rewarded or punished for unavailable information. Firms that shut down leave the ranking.",contactH:"Contact us",contactHSub:"A question or a number to correct? Reach us on any channel",ch_messenger:"Messenger",ch_telegram:"Telegram",ch_whatsapp:"WhatsApp",ch_email:"Email",ch_facebook:"Facebook",comingSoon:"Coming soon",honestH:"Worth knowing",honest1:"Trustpilot hiding any firm's rating is a fact published on its page, not a judgment from us.",honest2:"Rules and prices change, so check the firm's official site before paying any fee.",footer:"The decider between trader and prop firm · opinion and experience, not a recommendation · figures verified against their stated sources on {date}",lblPlat:"Platforms & ease of use",of5:"of 5",methPlat:"Platform score out of 5 = the n
