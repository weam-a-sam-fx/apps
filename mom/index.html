30 دقيقة موزعة على اليوم وهو صاحي.": "Give tummy time to a baby who is not yet mobile: at least 30 minutes spread through the day while awake.", "اللعب على الأرض بشكل تفاعلي بيحرّك الرضيع في أكتر من طريقة. كل ما كان أكتر كان أحسن.": "Interactive floor play gets the baby moving in different ways. The more, the better.", "ماتسيبيش الرضيع مربوط في عربية أو كرسي أكل أو محمول على الضهر أكتر من ساعة في المرة.": "Do not keep a baby restrained in a stroller, high chair or carrier for more than 1 hour at a time.", "الشاشات مش موصى بيها للرضع. وفي وقت الهدوء، القراءة والحكي مع الأم أو الأب مشجّع عليهم.": "Screen time is not recommended for infants. For quiet time, reading and storytelling with a parent is encouraged.", "السنة الأولى: النوم المطلوب من 14 لـ 17 ساعة (0 لـ 3 شهور) ومن 12 لـ 16 ساعة (4 لـ 11 شهر)، بالقيلولة.": "First year: recommended sleep is 14 to 17 hours (0 to 3 months) and 12 to 16 hours (4 to 11 months), including naps.", "الطفل من سنة لسنتين محتاج على الأقل 180 دقيقة نشاط بدني متنوع على مدار اليوم. كل ما زاد كان أحسن.": "A child aged 1 to 2 needs at least 180 minutes of varied physical activity spread through the day. More is better.", "النوم من 11 لـ 14 ساعة بالقيلولة، مع مواعيد نوم وصحيان ثابتة.": "Sleep: 11 to 14 hours including naps, with regular sleep and wake times.", "عمر سنة: مشاهدة الشاشة وهو قاعد (تلفزيون، فيديو، ألعاب) مش موصى بيها. عمر سنتين: مايزيدش عن ساعة واحدة، وأقل أحسن.": "At age 1: sedentary screen time (TV, video, games) is not recommended. At age 2: no more than 1 hour, and less is better.", "الأكاديمية الأمريكية بتشوف إن الأحسن تجنب التلفزيون والتطبيقات قبل 18 شهر. مكالمة الفيديو مع جد أو أب مسافر مفيهاش مشكلة.": "The AAP says it is best to avoid TV and apps before 18 months. Video calls with a grandparent or a parent who is away are fine.", "الطفل الصغير بيتعلم أكتر بالتفاعل مع الناس واللمس والتجربة، مش من الشاشة.": "Young children learn more from interacting with people, touching and trying things than from a screen.", "وقت القاعدة: هة والبقوليات (عدس، حمص، فول).": "Carbohydrates should come mainly from whole grains, vegetables, fruit and legumes (lentils, chickpeas, beans).", "البروتين ممكن يبقى من مصادر حيوانية ونباتية. الأكل من مصدر حيواني لسه مهم للأطفال عشان العناصر الغذائية.": "Protein can come from animal and plant sources. Animal-source foods are still important for children for nutrients.", "السكريات الحرة (المضافة والموجودة في العسل والعصير) لازم تفضل أقل من 10% من سعرات اليوم.": "Free sugars (added sugars and those in honey and juice) should stay below 10% of daily calories.", "أقل من 6 شهور": "Under 6 months", "رضاعة طبيعية حصرية (لبن الأم بس) ومن غير أي أكل أو شرب تاني": "Exclusive breastfeeding (breast milk only), with no other food or drink", "منظمة الصحة واليونيسف بيوصوا بالبدء في الرضاعة خلال ساعة من الولادة، ورضاعة طبيعية حصرية لأول 6 شهور.": "WHO and UNICEF recommend starting breastfeeding within 1 hour of birth, and exclusive breastfeeding for the first 6 months.", "الرضاعة بتفضل متكررة لحد سنتين أو أكتر.": "Frequent breastfeeding continues up to 2 years or beyond.", "من 6 لـ 8 شهور": "6 to 8 months", "من 2 لـ 3 وجبات في اليوم من الأكل التكميلي، مع استمرار الرضاعة": "2 to 3 meals a day of complementary food, while continuing breastfeeding", "حوالي 6 شهور احتياج الطفل للطاقة والعناصر بيزيد عن اللي لبن الأم بيوفره، فالأكل التكميلي ضروري.": "Around 6 months, the child's need for energy and nutrients goes beyond what breast milk provides, so complementary food is needed.", "ابدأي بكميات صغيرة وزوديها تدريجيا مع كبر الطفل.": "Start with small amounts and increase gradually as the child grows.", "زودي قوام الأكل وتنوعه تدريجيا.": "Gradually increase the thickness and variety of food.", "التنوع المطلوب: على الأقل 5 مجموعات غذائية في اليوم.": "Variety needed: at least 5 food groups a day.", "لو الطفل تعبان: زودي السوائل والرضاعة، وقدّمي أكل طري هو بيحبه.": "If the child is sick: give more fluids and breastfeeding, and offer soft foods they like.", "من 9 شهور لسنتين": "9 months to 2
