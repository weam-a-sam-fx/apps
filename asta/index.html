<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(180deg,#7fcbf2 0,#a9defa 380px,#cfeefc 100%) fixed;color:#0b2a5b;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:calc(env(safe-area-inset-top) + 10px) 14px 92px;max-width:520px;margin:0 auto;line-height:1.7;min-height:100vh}
h1{font-size:24px;margin:6px 0 2px;color:#0b2a5b}h2{font-size:18px;margin:14px 0 8px;color:#0b3a8a}.sub{font-size:13px;color:#33567f}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 4px}.logo{height:62px}.logo svg{width:100%;height:100%}.tag{font-size:13px;color:#33567f;font-weight:600;text-align:left}
.card{background:#fff;border:1px solid #b5dcf0;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 2px 10px rgba(11,42,91,.07)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:#fff;border:1px solid #b5dcf0;border-radius:16px;padding:14px 10px;text-align:center;color:#0b2a5b;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(11,42,91,.06)}.tile .e{display:block;font-size:26px;margin-bottom:4px}.tile.wide{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chip{background:#fff;border:1px solid #8fc9e8;border-radius:999px;padding:6px 14px;font-size:14px;color:#0b3a8a}
button{font:inherit}.back{background:none;border:0;color:#0b3a8a;font-weight:700;padding:6px 0}
.btn{background:#0b3a8a;color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:800;width:100%}.btn[disabled]{background:#c7d7e6;color:#6b809a}
.empty{border:1px dashed #6fb3d9;background:#f4fbff;border-radius:14px;padding:14px;color:#25476f;font-size:14px;margin-top:10px}
.disc{font-size:12px;background:#dff1fb;border-radius:12px;padding:8px 10px;margin:10px 0;color:#25476f}
select{font:inherit;background:#fff;color:#0b2a5b;border:1px solid #8fc9e8;border-radius:10px;padding:8px;width:100%;margin-top:6px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #b5dcf0;display:flex;justify-content:space-around;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);max-width:520px;margin:0 auto}
nav button{background:none;border:0;color:#5d7a99;padding:6px 8px;font-size:13px}nav button.on{color:#0b3a8a;font-weight:800;border-bottom:3px solid #d4a017}
ul{padding-inline-start:20px;margin:6px 0}li{margin:4px 0}
