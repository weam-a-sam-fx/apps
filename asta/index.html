<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>أسطى | مجتمع الصنايعية في مصر</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#0b1424"><meta name="robots" content="noindex">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#0b1424;color:#f3ecd2;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:calc(env(safe-area-inset-top) + 10px) 14px 92px;max-width:520px;margin:0 auto;line-height:1.7}
h1{font-size:24px;margin:6px 0 2px;color:#d4af37}h2{font-size:18px;margin:14px 0 8px;color:#d4af37}.sub{font-size:13px;color:#a9b3c4}
.top{display:flex;align-items:center;gap:10px;margin:6px 0 4px}.top svg{width:44px;height:44px;border-radius:12px}
.card{background:#121e33;border:1px solid #22314d;border-radius:18px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:#121e33;border:1px solid #22314d;border-radius:16px;padding:14px 10px;text-align:center;color:#f3ecd2;font:inherit;font-weight:700;cursor:pointer}.tile .e{display:block;font-size:26px;margin-bottom:4px}.tile.wide{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chip{background:#1a2a47;border:1px solid #2c4068;border-radius:999px;padding:6px 14px;font-size:14px}
button{font:inherit}.back{background:none;border:0;color:#d4af37;font-weight:700;padding:6px 0}
.btn{background:#d4af37;color:#1a1405;border:0;border-radius:12px;padding:11px 16px;font-weight:800;width:100%}.btn[disabled]{background:#3a4258;color:#9aa5ba}
.empty{border:1px dashed #3a4a6b;border-radius:14px;padding:14px;color:#c9d2e2;font-size:14px;margin-top:10px}
.disc{font-size:12px;background:#1a2a47;border-radius:12px;padding:8px 10px;margin:10px 0;color:#c9d2e2}
select{font:inherit;background:#1a2a47;color:#f3ecd2;border:1px solid #2c4068;border-radius:10px;padding:8px;width:100%;margin-top:6px}nav{position:fixed;bottom:0;left:0;right:0;background:#0f1a2e;border-top:1px solid #22314d;display:flex;justify-content:space-around;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);max-width:520px;margin:0 auto}
nav button{background:none;border:0;color:#a9b3c4;padding:6px 8px;font-size:13px}nav button.on{color:#d4af37;border-bottom:3px solid #d4af37}

</style></head><body>
<div class="top"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#121e33"/><path d="M14 46l18-26 18 26z" fill="none" stroke="#d4af37" stroke-width="4" stroke-linejoin="round"/><rect x="20" y="46" width="24" height="6" rx="2" fill="#d4af37"/></svg><div><h1>أسطى</h1><div class="sub">مجتمع الصنايعية في مصر</div></div></div>
<div class="disc">التطبيق في مرحلة التجهيز. لسه مفيش تسجيل ولا بيانات صنايعية. الأقسام ظاهرة عشان تشوف الشكل الجاي.</div>
<div id="v"></div>
<nav id="nv"></nav>
<script>
const SECT={
tr:{e:'🛠️',n:'الصنايعية',d:'صنايعية في كل المحافظات حسب الحرفة',chips:['سباك','كهربائي','فني تكييف','نجار','نقاش','حداد'],em:'لسه مفيش صنايعية مسجلين. القسم هيتملي لما التسجيل يفتح.'},
co:{e:'🏗️',n:'مقاولين',d:'مقاولين في كل المحافظات',chips:[],em:'لسه مفيش مقاولين مسجلين. القسم هيتملي لما التسجيل يفتح.'},
en:{e:'📐',n:'مهندسين',d:'مهندسين في كل المحافظات',chips:[],em:'لسه مفيش مهندسين مسجلين. القسم هيتملي لما التسجيل يفتح.'},
su:{e:'📦',n:'موردين وتوريد',d:'موردين ومحلات مواد البناء والعدد',chips:['مون','حديد','بويات','سيراميك','العدد والمعدات'],em:'لسه مفيش موردين مسجلين. القسم هيتملي لما التسجيل يفتح.'}};
const $=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k==='on')for(const x in a.on)e.addEventListener(x,a.on[x]);else e.setAttribute(k,a[k])}c.flat().forEach(x=>e.append(x&&x.nodeType?x:document.createTextNode(x==null?'':x)));return e};
const GOV=['القاهرة','الجيزة','الإسكندرية','القليوبية','الشرقية','الدقهلية','الغربية','المنوفية','البحيرة','كفر الشيخ','دمياط','بورسعيد','الإسماعيلية','السويس','شمال سيناء','جنوب سيناء','البحر الأحمر','بني سويف','الفيوم','المنيا','أسيوط','سوهاج','قنا','الأقصر','أسوان','الوادي الجديد','مطروح'];let gov=localStorage.getItem('asta_gov')||'';
const V=document.getElementById('v');let page='home';
const NAV=[['home','الرئيسية'],['cm','المجتمع'],['jn','انضم كصنايعي'],['pv','خصوصية البيانات']];
function go(p){page=p;render();scrollTo(0,0)}
function nav(){const n=document.getElementById('nv');n.innerHTML='';NAV.forEach(([k,l])=>n.append($('button',{class:page===k?'on':'',on:{click:()=>go(k)}},l)))}
const back=()=>$('button',{class:'back',on:{click:()=>go('home')}},'→ رجوع');
function home(){V.append($('h2',{},'الأقسام'));const g=$('div',{class:'grid'});
Object.keys(SECT).forEach(k=>g.append($('button',{class:'tile',on:{click:()=>go(k)}},$('span',{class:'e'},SECT[k].e),SECT[k].n)));
g.append($('button',{class:'tile',on:{click:()=>go('cm')}},$('span',{class:'e'},'💬'),'المجتمع'));
g.append($('button',{class:'tile',on:{click:()=>go('jn')}},$('span',{class:'e'},'🤝'),'انضم كصنايعي'));
g.append($('button',{class:'tile wide',on:{click:()=>go('pv')}},$('span',{class:'e'},'🔒'),'خصوصية البيانات'));V.append(g)}
function sect(k){const s=SECT[k];V.append(back(),$('h2',{},s.n),$('div',{class:'sub'},s.d));if(s.chips.length)V.append($('div',{class:'chips'},s.chips.map(c=>$('span',{class:'chip'},c))));V.append($('div',{class:'card'},$('label',{class:'sub'},'المحافظة'),$('div',{},$('select',{on:{change:e=>{gov=e.target.value;localStorage.setItem('asta_gov',gov);render()}}},$('option',{value:''},'كل المحافظات'),GOV.map(g=>$('option',Object.assign({value:g},g===gov?{selected:'selected'}:{}),g))))),$('div',{class:'empty'},(gov?'المحافظة: '+gov+'. ':'')+s.em),$('div',{class:'disc'},'القسم ده دليل بس. التطبيق مبيضمنش جودة شغل حد، واتفق على السعر والتفاصيل مباشرة قبل الشغل.'))}
function cm(){V.append(back(),$('h2',{},'المجتمع'),$('div',{class:'sub'},'مكان للصنايعية وأصحاب الشغل في كل مصر'));
[['الملفات الشخصية','ملف لكل صنايعي فيه حرفته ومنطقته وأعماله.'],['أسئلة وأجوبة','اسأل في الشغل وخد إجابة من أهل الحرفة.'],['طلبات الشغل','صاحب الشغل ينشر اللي محتاجه والصنايعية يتواصلوا معاه.']].forEach(([t,d])=>V.append($('div',{class:'card'},$('b',{},t),$('div',{class:'sub'},d),$('div',{class:'sub',style:'margin-top:6px;color:#d4af37'},'قريبًا. لسه مش متاح.'))))}
function jn(){V.append(back(),$('h2',{},'انضم كصنايعي'),$('div',{class:'card'},'التسجيل لسه مش مفتوح. لما يفتح هتقدر تضيف حرفتك ومنطقتك وطريقة التواصل معاك بنفسك، وهتقدر تحذف بياناتك في أي وقت.'),$('button',{class:'btn',disabled:'disabled'},'التسجيل غير مفتوح بعد'),$('div',{class:'disc'},'مفيش أي بيانات بتتجمع دلوقتي. مفيش خانات تسجيل في النسخة دي.'))}
function pv(){V.append(back(),$('h2',{},'خصوصية البيانات'),$('div',{class:'card'},$('b',{},'النسخة الحالية'),$('ul',{},$('li',{},'مفيش حسابات ولا تسجيل.'),$('li',{},'مفيش جمع بيانات ولا إعلانات ولا تتبع.'),$('li',{},'التطبيق مبيبعتش حاجة عنك لأي مكان.'))),$('div',{class:'card'},$('b',{},'لما التسجيل يفتح'),$('div',{class:'sub'},'هنحدّث الصفحة دي قبل ما نبدأ نجمع أي بيانات، ونقولك إيه اللي بنجمعه وليه. التسجيل هيبقى اختياري، وهتقدر تحذف بياناتك.')))}
function render(){nav();V.innerHTML='';({home,tr:()=>sect('tr'),co:()=>sect('co'),en:()=>sect('en'),su:()=>sect('su'),cm,jn,pv})[page]()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
