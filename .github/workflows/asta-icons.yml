name: asta-icons
on:
  push:
    paths: ['asta/*.b64']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          base64 -d asta/icon-192.b64 > asta/icon-192.png
          base64 -d asta/icon-512.b64 > asta/icon-512.png
          base64 -d asta/icon-maskable-512.b64 > asta/icon-maskable-512.png
          git config user.name github-actions
          git config user.email actions@github.com
          git add asta/icon-192.png asta/icon-512.png asta/icon-maskable-512.png
          git commit -m "asta icons" || true
          git push
