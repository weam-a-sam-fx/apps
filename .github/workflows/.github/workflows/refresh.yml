name: refresh-data
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update gold daily bar
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime
          req = urllib.request.Request("https://query1.finance.yahoo.com/v8/finance/chart/GC=F?range=10d&interval=1d", headers={"User-Agent": "Mozilla/5.0"})
          r = json.load(urllib.request.urlopen(req, timeout=30))["chart"]["result"][0]
          ts = r["timestamp"]; q = r["indicators"]["quote"][0]
          rows = [(datetime.datetime.utcfromtimestamp(t).date(), q["close"][i], q["high"][i], q["low"][i]) for i, t in enumerate(ts) if q["close"][i] is not None]
          today = datetime.datetime.utcnow().date()
          if rows and rows[-1][0] >= today and len(rows) > 1:
              rows = rows[:-1]
          d, c, hi, lo = rows[-1]
          data = json.load(open("data.json"))
          data["gold"] = {"date": str(d), "close": round(c, 2), "high": round(hi, 2), "low": round(lo, 2), "src": "COMEX gold futures GC=F via Yahoo Finance"}
          data["asof"] = str(today)
          json.dump(data, open("data.json", "w"), ensure_ascii=False, separators=(",", ":"))
          PY
      - name: Commit if changed
        run: |
          git config user.name "refresh-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "daily data refresh" && git push)
